name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version (X.Y.Z). Leave empty to patch-bump.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release only runs on main (ref=$GITHUB_REF)" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install validation tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          npm install -g @anthropic-ai/claude-code

      - name: Validate current source and generated trees
        run: |
          python3 scripts/build.py
          python3 scripts/check.py
          python3 -m pytest

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release_version.py --requested "${REQUESTED_VERSION:-}")"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "tag v${version} already exists" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Bump source versions and regenerate
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release_version.py --requested "$RELEASE_VERSION" --apply
          python3 scripts/build.py
          python3 -m pytest
          claude plugin validate ./plugins/claude --strict

      - name: Commit and validate release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/manifests plugins .claude-plugin/marketplace.json .cursor-plugin/marketplace.json .agents/plugins/marketplace.json
          git commit -m "chore: release ${RELEASE_VERSION}"
          python3 scripts/build.py
          python3 scripts/check.py

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v${RELEASE_VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${RELEASE_VERSION}"
          gh release create "v${RELEASE_VERSION}" --verify-tag --title "v${RELEASE_VERSION}" --generate-notes
